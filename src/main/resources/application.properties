spring.application.name=deepproject

spring.mvc.problemdetails.enabled=true
server.forward-headers-strategy=FRAMEWORK
server.port=8081

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:deepproject_db}?options=-c%20timezone=UTC
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Database & Flyway
spring.flyway.enabled=true
spring.flyway.locations=filesystem:database/scripts/migrations
spring.flyway.baseline-on-migrate=true

# JPA & Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Keycloak OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/deepproject}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8090/realms/deepproject/protocol/openid-connect/certs}

# OpenTelemetry — export traces and metrics to Grafana LGTM (start with -WithTelemetry)
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.metrics.export.enabled=true
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# Springdoc OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.oauth.client-id=deepproject-api
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.oauth.scopes=openid

# Default OAuth2 endpoint (used as default if not overridden in OpenAPI bean)
springdoc.swagger-ui.oauth2-authorization-url=http://localhost:8090/realms/deepproject/protocol/openid-connect/auth
springdoc.swagger-ui.oauth.token-url=http://localhost:8090/realms/deepproject/protocol/openid-connect/token